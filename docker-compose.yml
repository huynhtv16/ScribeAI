services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://scribe:scribe@postgres:5432/scribe
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      TRANSLATION_API_URL: ${TRANSLATION_API_URL:-https://api.openai.com/v1}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-gpt-4o-mini}
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    volumes: ["audio-data:/app/data"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"], interval: 5s, timeout: 3s, retries: 20}
  asr-worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      API_URL: http://api:8000
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
    volumes: ["audio-data:/app/data"]
    depends_on:
      api: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: scribe, POSTGRES_PASSWORD: scribe, POSTGRES_DB: scribe}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U scribe"], interval: 5s, timeout: 3s, retries: 10}
volumes:
  redis-data:
  postgres-data:
  audio-data:
