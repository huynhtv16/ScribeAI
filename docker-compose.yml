services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://scribe:scribe@postgres:5432/scribe
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: scribe, POSTGRES_PASSWORD: scribe, POSTGRES_DB: scribe}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U scribe"], interval: 5s, timeout: 3s, retries: 10}
volumes:
  redis-data:
  postgres-data:
